name: Опублікувати довідник

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Завантажити файли репозиторію
        uses: actions/checkout@v4

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Встановити залежності
        run: pip install -r requirements.txt

      - name: Зібрати та опублікувати на GitHub Pages
        run: mkdocs gh-deploy --force
