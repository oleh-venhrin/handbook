site_name: Довідничок 3-го класу
site_url: https://oleh-venhrin.github.io/handbook/
repo_url: https://github.com/oleh-venhrin/handbook
site_description: Шкільний довідник з математики та інших предметів
site_author: Тато і Син

theme:
  name: material
  language: uk
  palette:
    # Світла тема
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Увімкнути темну тему
    # Темна тема
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Увімкнути світлу тему
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Головна: index.md
  - Математика:
      - Таблиця Піфагора: math/multiplication.md
      - Щоденник Стіва (Множення в Minecraft):
          - День 1. Дзеркало блоків (× 1): math/minecraft/day-01.md
          - День 2. Стів і Алекс (× 2): math/minecraft/day-02.md
          - День 3. Кріпер і TNT (× 3): math/minecraft/day-03.md
          - День 4. Загін на фермі (× 4): math/minecraft/day-04.md
          - День 5. Торговець і смарагди (× 5): math/minecraft/day-05.md
          - День 6. Бджоли і стільники (× 6): math/minecraft/day-06.md
          - День 7. Зачарована вежа (× 7): math/minecraft/day-07.md
          - День 8. Печера павуків (× 8): math/minecraft/day-08.md
          - День 9. Таємниця верстака (× 9): math/minecraft/day-09.md
          - День 10. Портал у Незер (× 10): math/minecraft/day-10.md
      - Задачі та формули: math/rules.md
  - Українська мова:
      - Частини мови: ukr/parts-of-speech.md
